<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vagas</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>
  </head>
  <body>
    <a href="#" class="site-link" onclick="window.scrollTo({top:0,behavior:'smooth'}); return false;">
      <h1>Job Tracker</h1>
    </a>

    <div class="page-wrap">

      <div class="card counter-card">
        <div class="counter-info">
          <div class="counter-number" id="count">0</div>
          <div class="counter-label">candidaturas</div>
        </div>
        <div class="counter-btns">
          <button class="btn-c plus" onclick="change(1)">+</button>
          <button class="btn-c minus" onclick="change(-1)">−</button>
          <button class="btn-clear" onclick="resetCount()">CLEAR</button>
        </div>
      </div>

      <div class="add-row board-add-row">
        <input
          type="text"
          id="input-empresa"
          placeholder="Nome da empresa"
          maxlength="30"
          onkeydown="if (event.key === 'Enter') addApplication();"
        />
        <input type="date" id="input-date" />
        <button class="btn-add" onclick="addApplication()">+</button>
      </div>

      <div class="board" id="board"></div>

      <div class="footer">
        <button class="btn-io" onclick="exportData()">⬇ Exportar</button>
        <button
          class="btn-io"
          onclick="document.getElementById('file-input').click()"
        >
          ⬆ Importar
        </button>
        <input
          type="file"
          id="file-input"
          accept=".json"
          style="display: none"
          onchange="importData(event)"
        />
      </div>

    </div>

    <button id="bg-toggle" class="bg-toggle" onclick="toggleBackground()" title="Alternar fundo">🖼️</button>

    <script src="script.js"></script>
  </body>
</html>
